<style>
/* ============================================================
   AMALTHÉE — tokens
   ============================================================ */
:root{
  --vanilla:#FFF9EB;
  --sage:#9FB2AC;
  --blood:#5D0D18;
  --ember:#D96A3E;

  --bg:#FFF9EB;
  --surface:#FBF2DF;
  --surface-2:#F5EAD4;
  --ink:#1E1712;
  --ink-soft:#6E655B;
  --rule:#DCD2BC;
  --accent:#5D0D18;
  --accent-soft:#8E2233;
  --warm:#D96A3E;
  --calm:#9FB2AC;
  --calm-deep:#6F8781;
  --on-accent:#FFF9EB;

  --f:"Helvetica Neue","Inter","Segoe UI",Arial,system-ui,sans-serif;
  --t1:11px; --t2:13px; --t3:15px; --t4:18px; --t5:24px; --t6:34px; --t7:52px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r:3px;
  --tab-h:calc(60px + env(safe-area-inset-bottom,0px));
  --dur:.22s;
}
:root[data-theme="dark"]{
  --bg:#141010;
  --surface:#1D1717;
  --surface-2:#262020;
  --ink:#FFF9EB;
  --ink-soft:#9C918A;
  --rule:#332A2A;
  --accent:#8E2233;
  --accent-soft:#B03144;
  --warm:#D96A3E;
  --calm:#9FB2AC;
  --calm-deep:#9FB2AC;
  --on-accent:#FFF9EB;
}
@media (prefers-reduced-motion:reduce){ :root{ --dur:0s } *{animation-duration:.001s!important;transition-duration:.001s!important} }

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--f); font-size:var(--t3); line-height:1.45;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--warm);outline-offset:2px;border-radius:2px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* [hidden] doit l'emporter sur les display: posés par id */
[hidden]{display:none!important}

/* ---------- app shell ---------- */
#app{min-height:100dvh;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 var(--s4);padding-bottom:calc(var(--tab-h) + var(--s6))}
.view.nopad{padding-left:0;padding-right:0}

/* ---------- typography ---------- */
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
h1{font-size:var(--t6);line-height:1.1}
h2{font-size:var(--t5);line-height:1.15}
h3{font-size:var(--t4)}
p{margin:0 0 var(--s3)}
.lbl{font-size:var(--t1);color:var(--calm-deep);letter-spacing:.04em;font-weight:500}
.muted{color:var(--ink-soft)}
.small{font-size:var(--t2)}
.mono-big{font-size:var(--t7);font-weight:700;letter-spacing:-.045em;line-height:1;color:var(--accent)}

/* ---------- header ---------- */
.hdr{padding:calc(env(safe-area-inset-top,0px) + var(--s5)) var(--s4) var(--s3);display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s3)}
.hdr .sub{font-size:var(--t2);color:var(--ink-soft)}
.backbar{display:flex;align-items:center;gap:var(--s3);padding:calc(env(safe-area-inset-top,0px) + var(--s4)) var(--s4) var(--s2)}
.back{font-size:var(--t2);color:var(--calm-deep);font-weight:500;display:flex;align-items:center;gap:6px}
.back svg{width:14px;height:14px}

/* ---------- rules & rows ---------- */
.rule{height:1px;background:var(--rule);border:0;margin:var(--s4) 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s4) 0;border-bottom:1px solid var(--rule);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .l{min-width:0}
.row .r{text-align:right;flex-shrink:0}
.row strong{display:block;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r strong{font-size:var(--t4)}

/* ---------- class cards (ledger, not SaaS cards) ---------- */
.classcard{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--calm);background:var(--surface);padding:var(--s4);margin-bottom:var(--s2);border-radius:0 var(--r) var(--r) 0}
.classcard.filled{border-left-color:var(--accent)}
.classcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3)}
.classcard h3{font-size:var(--t3);font-weight:700}
.classcard .val{font-size:var(--t5);font-weight:700;letter-spacing:-.03em;color:var(--accent)}
.classcard .hint{font-size:var(--t2);color:var(--ink-soft);margin-top:2px}
.classcard .meta{display:flex;gap:var(--s3);margin-top:var(--s2);font-size:var(--t2);color:var(--ink-soft)}
.cta-inline{display:inline-block;margin-top:var(--s3);font-size:var(--t2);font-weight:700;color:var(--warm)}

/* ---------- buttons ---------- */
.btn{display:block;width:100%;text-align:center;padding:15px var(--s4);background:var(--accent);color:var(--on-accent);font-weight:700;font-size:var(--t3);border-radius:var(--r);letter-spacing:-.01em}
.btn:disabled{opacity:.35}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn.ember{background:var(--warm);color:#231208}
.btn.quiet{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn+.btn{margin-top:var(--s2)}
.btnrow{display:flex;gap:var(--s2)}
.btnrow .btn{flex:1}
.chip{display:inline-block;padding:5px 10px;border:1px solid var(--rule);border-radius:99px;font-size:var(--t2);font-weight:500;background:var(--surface)}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip.warm{background:transparent;color:var(--warm);border-color:var(--warm)}

/* ---------- form ---------- */
.field{width:100%;background:transparent;border:0;border-bottom:2px solid var(--rule);padding:var(--s3) 0;font-size:var(--t6);font-weight:700;letter-spacing:-.03em}
.field:focus{border-bottom-color:var(--accent);outline:none}
.field::placeholder{color:var(--rule);font-weight:400}
.field.sm{font-size:var(--t4);font-weight:500;letter-spacing:0}
select.field{font-size:var(--t4);font-weight:500;letter-spacing:0;border:1px solid var(--rule);border-radius:var(--r);padding:var(--s3);background:var(--surface)}
.helper{font-size:var(--t2);color:var(--ink-soft);margin-top:var(--s2)}
.err{font-size:var(--t2);color:var(--warm);margin-top:var(--s2);font-weight:500;min-height:18px}

/* ---------- wizard ---------- */
.wiz{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column}
.wiz.on{display:flex}
.wiz-top{padding:calc(env(safe-area-inset-top,0px) + var(--s4)) var(--s4) 0}
.prog{height:2px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:var(--s3)}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width var(--dur) ease}
.wiz-body{flex:1;overflow-y:auto;padding:var(--s6) var(--s4) var(--s4);display:flex;flex-direction:column}
.wiz-q{font-size:var(--t5);font-weight:700;letter-spacing:-.025em;margin-bottom:var(--s5);max-width:22ch}
.wiz-foot{padding:var(--s3) var(--s4) calc(env(safe-area-inset-bottom,0px) + var(--s4));border-top:1px solid var(--rule)}
.opt{display:block;width:100%;text-align:left;padding:var(--s4);border:1px solid var(--rule);border-radius:var(--r);margin-bottom:var(--s2);background:var(--surface)}
.opt.on{border-color:var(--accent);background:var(--surface-2)}
.opt strong{display:block;font-weight:700}
.opt span{font-size:var(--t2);color:var(--ink-soft)}

/* ---------- tabbar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;height:var(--tab-h);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:var(--bg);border-top:1px solid var(--rule);z-index:40}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-soft);font-size:10px;font-weight:500}
.tabbar button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--accent)}
.tabbar.hide{display:none}

/* ---------- chart ---------- */
.chart{width:100%;height:132px;display:block;margin:var(--s3) 0}
.chart path.line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart path.area{fill:var(--accent);opacity:.07;stroke:none}
.chart line.grid{stroke:var(--rule);stroke-width:1}

/* ---------- misc ---------- */
.sheet{position:fixed;inset:0;z-index:70;display:none}
.sheet.on{display:block}
.sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:12px 12px 0 0;padding:var(--s5) var(--s4) calc(env(safe-area-inset-bottom,0px) + var(--s4));max-height:88dvh;overflow-y:auto}
.toast{position:fixed;left:var(--s4);right:var(--s4);bottom:calc(var(--tab-h) + var(--s3));background:var(--ink);color:var(--bg);padding:var(--s3) var(--s4);border-radius:var(--r);font-size:var(--t2);font-weight:500;z-index:90;opacity:0;transform:translateY(6px);transition:opacity var(--dur),transform var(--dur);pointer-events:none}
.toast.on{opacity:1;transform:none}
.empty{padding:var(--s6) 0;text-align:center;color:var(--ink-soft)}
.tag{font-size:var(--t1);font-weight:700;color:var(--calm-deep)}
.up{color:var(--calm-deep)}
.down{color:var(--warm)}
.alert{border-left:3px solid var(--warm);background:var(--surface);padding:var(--s3) var(--s4);margin-bottom:var(--s2);border-radius:0 var(--r) var(--r) 0}
.alert.calm{border-left-color:var(--calm)}
.alert h3{font-size:var(--t3)}
.alert p{margin:2px 0 0;font-size:var(--t2);color:var(--ink-soft)}
.kv{display:flex;justify-content:space-between;padding:var(--s2) 0;border-bottom:1px solid var(--rule);font-size:var(--t3)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink-soft)}
.kv span:last-child{font-weight:700}
.seg{display:flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.seg button{flex:1;padding:10px;font-size:var(--t2);font-weight:600;color:var(--ink-soft)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.more{display:block;width:100%;padding:var(--s3);text-align:center;font-size:var(--t2);font-weight:700;color:var(--calm-deep)}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column}
#intro.out{animation:fade .5s ease forwards}
@keyframes fade{to{opacity:0;visibility:hidden}}
#horn{width:min(74vw,300px);height:auto}
#horn .stroke{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#horn .seed{fill:var(--calm);opacity:0}
#horn .seed.e{fill:var(--warm)}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.15s cubic-bezier(.5,.05,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:translateY(-14px) scale(.4)}60%{opacity:1;transform:translateY(2px) scale(1.06)}100%{opacity:1;transform:none}}
#greet{position:fixed;inset:0;z-index:99;background:var(--bg);display:none;align-items:center;justify-content:center;padding:var(--s6)}
#greet.on{display:flex}
#greet h1{font-size:var(--t6);letter-spacing:-.035em;animation:rise .6s ease forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#greet.out{animation:fade .55s ease .9s forwards}
.skip{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + var(--s5));left:0;right:0;text-align:center;font-size:var(--t2);color:var(--ink-soft)}
</style>
</head>

<script>
"use strict";
/* Sur mobile il n'y a pas de console : toute erreur devient visible à l'écran. */
window.addEventListener('error',ev=>{
  let b=document.getElementById('crash');
  if(!b){ b=document.createElement('div'); b.id='crash';
    b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#5D0D18;color:#FFF9EB;font:12px/1.4 -apple-system,sans-serif;padding:12px;white-space:pre-wrap';
    document.body.appendChild(b); }
  b.textContent='Erreur : '+(ev.message||ev.error)+'\n'+(ev.filename||'')+' ligne '+(ev.lineno||'?');
});

/* ============================================================
   1. PERSISTANCE  (window.storage uniquement, jamais localStorage)
   ============================================================ */
const KEY='amalthee:state';
const MEM={v:null};
/* Trois niveaux, dans cet ordre :
   1. window.storage  — quand l'app tourne dans Claude
   2. localStorage    — quand l'app tourne en autonomie sur le téléphone
   3. mémoire         — repli silencieux si les deux sont indisponibles      */
const HAS_WS = !!(typeof window!=='undefined' && window.storage && window.storage.get);
function hasLS(){ try{ const k='__a'; window.localStorage.setItem(k,'1'); window.localStorage.removeItem(k); return true; }catch(e){ return false; } }
const HAS_LS = !HAS_WS && hasLS();
const Store={
  mode: HAS_WS?'claude':(HAS_LS?'appareil':'mémoire'),
  async load(){
    if(HAS_WS){ try{ const r=await window.storage.get(KEY,false); if(r&&r.value) return JSON.parse(r.value); }catch(e){} }
    if(HAS_LS){ try{ const v=window.localStorage.getItem(KEY); if(v) return JSON.parse(v); }catch(e){} }
    return MEM.v?JSON.parse(MEM.v):null;
  },
  async save(obj){
    const str=JSON.stringify(obj,(k,v)=>k==='_c'?undefined:v);
    MEM.v=str;
    if(HAS_WS){ try{ await window.storage.set(KEY,str,false); return; }catch(e){} }
    if(HAS_LS){ try{ window.localStorage.setItem(KEY,str); }catch(e){ toast('Mémoire de l\u2019appareil pleine, pensez à exporter.'); } }
  },
  async wipe(){
    MEM.v=null;
    if(HAS_WS){ try{ await window.storage.delete(KEY,false); }catch(e){} }
    if(HAS_LS){ try{ window.localStorage.removeItem(KEY); }catch(e){} }
  }
};

/* ============================================================
   2. ÉTAT
   ============================================================ */
const CLASSES={
  bourse:{name:'Bourse',teach:'Actions, ETF, obligations',cta:'Ajouter une ligne'},
  immobilier:{name:'Immobilier',teach:'Résidence, locatif, SCPI',cta:'Ajouter un bien'},
  enveloppes:{name:'Enveloppes',teach:'PEA, CTO, assurance-vie',cta:'Ajouter une enveloppe'},
  liquidites:{name:'Liquidités',teach:'Comptes et livrets',cta:'Ajouter un compte'}
};
const ENV_TAX={PEA:.172,CTO:.30,AV:.247};
const ENV_NAME={PEA:'PEA',CTO:'Compte-titres',AV:'Assurance-vie'};
const CCY={EUR:{s:'€',n:'Euro'},USD:{s:'$',n:'Dollar américain'},CHF:{s:'CHF',n:'Franc suisse'},GBP:{s:'£',n:'Livre sterling'}};

function blank(){
  return {
    v:1,
    onboarded:false,
    user:{name:'',base:'EUR'},
    theme:'system',
    /* taux : valeur en EUR d'une unité de devise */
    rates:{EUR:1,USD:0.92,CHF:1.06,GBP:1.17},
    assets:[], lots:[], liabilities:[], envelopes:[], projects:[],
    watchlist:[],
    tdKey:'6f0d215bf4844d408da2003d9b3a93d4',
    snapshots:[],
    drafts:{},
    dismissed:[],
    totals:{total:0,byClass:{bourse:0,immobilier:0,enveloppes:0,liquidites:0},debt:0},
    lastOpen:null
  };
}
let S=blank();
let dirty=false;
function persist(){ dirty=true; clearTimeout(persist._t); persist._t=setTimeout(()=>{dirty=false;Store.save(S);},120); }

/* ============================================================
   3. UTILITAIRES
   ============================================================ */
const uid=()=>Math.random().toString(36).slice(2,10);
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO=()=>new Date().toISOString().slice(0,10);
function fmtDate(d){ if(!d) return '—'; const x=new Date(d+'T00:00:00');
  return x.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:x.getFullYear()===new Date().getFullYear()?undefined:'numeric'}); }
function daysSince(d){ if(!d) return 9999; return Math.floor((Date.now()-new Date(d+'T00:00:00').getTime())/86400000); }

/* devise : tout pivote par l'euro, le taux est figé à l'écriture */
const fxNow=c=>S.rates[c]||1;
const toEUR=(amt,ccy,frozen)=>amt*(frozen!=null?frozen:fxNow(ccy));
const eurToBase=e=>e/(S.rates[S.user.base]||1);
function money(eur,opt){
  const v=eurToBase(eur), s=CCY[S.user.base].s, o=opt||{};
  const dec=o.dec!=null?o.dec:(Math.abs(v)>=1000?0:2);
  const n=v.toLocaleString('fr-FR',{minimumFractionDigits:dec,maximumFractionDigits:dec});
  return (o.sign&&v>0?'+':'')+n+' '+s;
}
function pct(x,d){ return (x*100).toLocaleString('fr-FR',{minimumFractionDigits:d==null?1:d,maximumFractionDigits:d==null?1:d})+' %'; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2200); }
function num(v){ const n=parseFloat(String(v).replace(',','.').replace(/\s/g,'')); return isNaN(n)?null:n; }

/* ============================================================
   4. CATALOGUE LOCAL (aucun appel réseau)
   ============================================================ */
const CATALOG=[
 {n:"LVMH",isin:"FR0000121014",tk:"MC",pl:"Euronext Paris",c:"EUR",sec:"Luxe",p:"France",px:642.30},
 {n:"TotalEnergies",isin:"FR0000120271",tk:"TTE",pl:"Euronext Paris",c:"EUR",sec:"Énergie",p:"France",px:58.42},

 {n:"Airbus",isin:"NL0000235190",tk:"AIR",pl:"Euronext Paris",c:"EUR",sec:"Aéronautique",p:"Pays-Bas",px:158.94},
 {n:"Hermès International",isin:"FR0000052292",tk:"RMS",pl:"Euronext Paris",c:"EUR",sec:"Luxe",p:"France",px:2184.00},
 {n:"Schneider Electric",isin:"FR0000121972",tk:"SU",pl:"Euronext Paris",c:"EUR",sec:"Industrie",p:"France",px:232.40},

/* ============================================================
   4bis. BOURSE — Twelve Data (cours + fondamentaux à la demande)
   Aucun appel n'est déclenché automatiquement : uniquement au clic
   sur « Actualiser » ou à l'ouverture d'une fiche. Rien n'est mis
   en cache dans l'état persistant (données toujours fraîches).
   ============================================================ */
const TD_BASE='https://api.twelvedata.com';
async function tdGet(path,params){
  const key=(S.tdKey||'').trim();
  if(!key) return {error:'Aucune clé Twelve Data renseignée dans Réglages.'};
  const qs=new URLSearchParams(Object.assign({},params,{apikey:key})).toString();
  try{
    const r=await fetch(`${TD_BASE}/${path}?${qs}`);
    const j=await r.json();
    if(j && j.status==='error') return {error:j.message||'Erreur Twelve Data.'};
    if(j && j.code && j.code!==200 && j.message) return {error:j.message};
    return j;
  }catch(e){ return {error:'Réseau indisponible.'}; }
}
/* recherche libre de titres (pas limitée au catalogue local) */
async function tdSymbolSearch(q){
  if(!q||q.trim().length<1) return [];
  const j=await tdGet('symbol_search',{symbol:q});
  if(j.error||!j.data) return [];
  return j.data.filter(x=>x.instrument_type==='Common Stock').slice(0,10);
}
async function tdQuote(symbol,exchange){
  const j=await tdGet('quote',{symbol,...(exchange?{mic_code:exchange}:{})});
  if(j.error) return j;
  return {price:num(j.close),change:num(j.percent_change),name:j.name,currency:j.currency,exchange:j.exchange};
}
async function tdStatistics(symbol,exchange){
  const j=await tdGet('statistics',{symbol,...(exchange?{mic_code:exchange}:{})});
  if(j.error) return j;
  const st=j.statistics||{};
  const val=st.valuations_metrics||{}, fin=st.financials||{}, div=st.dividends_and_splits||{}, growth=fin.income_statement||{};
  return {
    per:val.trailing_pe??val.forward_pe??null,
    bna:fin.earnings_per_share??null,
    dividendeRendement:div.forward_annual_dividend_yield??null,
    dividendeMontant:div.forward_annual_dividend_rate??null,
    croissanceCA:fin.quarterly_revenue_growth??null,
    marge:fin.profit_margin??null
  };
}

/* ============================================================
   5. MODÈLE — totaux maintenus de façon incrémentale
   ============================================================ */
function lotsOf(id){ return S.lots.filter(l=>l.assetId===id); }
function qtyOf(id){ return lotsOf(id).reduce((n,l)=>n+l.qty,0); }

function assetValueEUR(a){
  if(a.cls==='bourse'){
    const q=qtyOf(a.id), p=a.px||{};
    return q*(p.value||0)*(p.fx!=null?p.fx:fxNow(a.ccy));
  }
  if(a.cls==='immobilier') return (a.value||0)*(a.fx!=null?a.fx:fxNow(a.ccy));
  if(a.cls==='liquidites') return (a.balance||0)*(a.fx!=null?a.fx:fxNow(a.ccy));
  if(a.cls==='enveloppes') return (a.cash||0)*(a.fx!=null?a.fx:fxNow(a.ccy));
  return 0;
}
function assetCostEUR(a){
  if(a.cls==='bourse') return lotsOf(a.id).reduce((n,l)=>n+(l.qty*l.price+ (l.fees||0))*(l.fx!=null?l.fx:fxNow(l.ccy)),0);
  if(a.cls==='immobilier') return ((a.buyPrice||0)+(a.fees||0)+(a.works||0))*(a.fx!=null?a.fx:fxNow(a.ccy));
  return assetValueEUR(a);
}
function bucketOf(a){ return a.cls==='bourse' ? (a.envId?'enveloppes':'bourse') : a.cls; }

/* recalcule un seul actif et ajuste les agrégats par delta */
function touch(a){
  const prev=a._c;
  if(prev){ S.totals.byClass[prev.b]-=prev.v; S.totals.total-=prev.v; }
  const v=assetValueEUR(a), c=assetCostEUR(a), b=bucketOf(a);
  a._c={v,c,b};
  S.totals.byClass[b]=(S.totals.byClass[b]||0)+v;
  S.totals.total+=v;
  persist();
}
function touchDebt(){
  S.totals.debt=S.liabilities.reduce((n,l)=>n+(l.amount||0),0);
}
function rebuildTotals(){
  S.totals={total:0,byClass:{bourse:0,immobilier:0,enveloppes:0,liquidites:0},debt:0};
  S.assets.forEach(a=>{ a._c=null; touch(a); });
  touchDebt();
}
const netWorth=()=>S.totals.total-S.totals.debt;
const assetById=id=>S.assets.find(a=>a.id===id);
const assetsIn=cls=>S.assets.filter(a=>bucketOf(a)===cls);

/* fiscalité latente par enveloppe */
function envTax(env){
  const inside=S.assets.filter(a=>a.envId===env.id);
  const val=inside.reduce((n,a)=>n+(a._c?a._c.v:0),0)+(env._c?env._c.v:0);
  const cost=inside.reduce((n,a)=>n+(a._c?a._c.c:0),0)+(env._c?env._c.v:0);
  const gain=val-cost, rate=ENV_TAX[env.kind]||0;
  return {val,cost,gain,rate,tax:gain>0?gain*rate:0,net:val-(gain>0?gain*rate:0)};
}
function taxTotal(){ return assetsIn('enveloppes').filter(a=>a.cls==='enveloppes').reduce((n,e)=>n+envTax(e).tax,0); }

   6. SNAPSHOTS
   ============================================================ */
function snapshotToday(){
  const d=todayISO(), t=netWorth();
  const b=Object.assign({},S.totals.byClass);
  const i=S.snapshots.findIndex(x=>x.d===d);
  if(i>=0) S.snapshots[i]={d,t,b}; else S.snapshots.push({d,t,b});
  S.snapshots.sort((x,y)=>x.d<y.d?-1:1);
  if(S.snapshots.length>2000) S.snapshots=S.snapshots.slice(-2000);
  persist();
}
function series(days){
  let a=S.snapshots;
  if(days){ const cut=new Date(Date.now()-days*86400000).toISOString().slice(0,10); a=a.filter(x=>x.d>=cut); }
  const MAX=180;
  if(a.length<=MAX) return a;
  const step=a.length/MAX, out=[];
  for(let i=0;i<MAX;i++) out.push(a[Math.floor(i*step)]);
  out.push(a[a.length-1]);
  return out;
}
function makeDemoHistory(){
  const n=270, base=Math.max(netWorth(),1)||120000, out=[];
  let v=base*0.78;
  for(let i=n;i>=0;i--){
    const d=new Date(Date.now()-i*86400000).toISOString().slice(0,10);
    v=v*(1+(Math.sin(i/17)*0.004)+(Math.random()-0.47)*0.006);
    if(i%23===0) v*=0.988;
    out.push({d,t:Math.round(v),b:Object.assign({},S.totals.byClass)});
  }
  const k=base/out[out.length-1].t;
  out.forEach(x=>x.t=Math.round(x.t*k));
  S.snapshots=out; persist();
}

/* ---------- courbe ---------- */
function chart(days){
  const a=series(days);
  if(a.length<2) return '';
  const w=340,h=132,pad=6;
  const vs=a.map(x=>x.t), mn=Math.min(...vs), mx=Math.max(...vs), sp=(mx-mn)||1;
  const X=i=>pad+i*(w-2*pad)/(a.length-1);
  const Y=v=>h-pad-((v-mn)/sp)*(h-2*pad-10);
  let d=''; a.forEach((x,i)=>{ d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(x.t).toFixed(1)+' '; });
  const area=d+`L${X(a.length-1).toFixed(1)} ${h} L${pad} ${h} Z`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path class="area" d="${area}"/><path class="line" d="${d}"/></svg>
    <div style="display:flex;justify-content:space-between" class="lbl"><span>${fmtDate(a[0].d)}</span><span>${fmtDate(a[a.length-1].d)}</span></div>`;
}
function variation(days){
  const a=series(days); if(a.length<2) return null;
  const f=a[0].t,l=a[a.length-1].t; if(!f) return null;
  return {abs:l-f,rel:(l-f)/Math.abs(f)};
}

VIEW.projets=function(){

  const rows=list.map(p=>{

      <span class="l"><strong>${esc(p.name)}</strong><span class="small muted">${p.done?'Acté · intégré au patrimoine':'À l\u2019étude · hors patrimoine'} · ${fmtDate(p.date)}</span></span>
      <span class="r"><strong class="num">${money(p.target)}</strong><span class="small muted num">${fin.monthly?money(fin.monthly)+'/mois':''}</span></span></button>`;
  }).join('');
  return `<div class="hdr"><div><div class="lbl">Projets</div><h1>${list.length||'Aucun'}</h1></div></div>
    <div class="view">
      <p class="muted small">Un projet reste en dehors du patrimoine tant qu'il n'est pas acté. Une fois acté, le bien et son crédit basculent dans Patrimoine.</p>
      <hr class="rule">
      ${list.length?rows:'<div class="empty">Rien à financer pour le moment.</div>'}
      <div style="margin-top:var(--s5)"><button class="btn" data-act="startProj">Créer un projet</button></div>
    </div>`;
};
function finance(p){
  const borrowed=Math.max((p.target||0)+(p.fees||0)-(p.down||0),0);
  const n=(p.years||0)*12, i=(p.rate||0)/100/12, ins=(p.insurance||0)/100/12*borrowed;
  let m=0;
  if(borrowed>0&&n>0) m = i>0 ? borrowed*i/(1-Math.pow(1+i,-n)) : borrowed/n;
  return {borrowed,monthly:m+ins,insurance:ins,cost:(m*n)-borrowed};
}

  const p=S.projects.find(x=>x.id===id); if(!p) return backbar('Introuvable')+'<div class="view"></div>';

/* ---------- Bourse (watchlist + fiche titre en direct) ---------- */
let BQ='', BQres=[], BQloading=false;
const SEARCH_CACHE={};
function titleKey(x){ return x.isin ? x.isin : (x.tk+'|'+(x.mic||x.pl||'')); }
function cacheItem(x){ SEARCH_CACHE[titleKey(x)]=x; return x; }
function findTitle(key){
  return CATALOG.find(c=>titleKey(c)===key)
      || S.watchlist.find(w=>titleKey(w)===key)
      || SEARCH_CACHE[key] || null;
}
async function doBourseSearch(){
  const q=BQ.trim();
  if(q.length<2){ BQres=[]; render(); return; }
  BQloading=true; render();
  const local=searchCatalog(q).map(c=>Object.assign({},c));
  let live=[];
  if(S.tdKey){
    const r=await tdSymbolSearch(q);
    live=r.filter(x=>x.country==='France').map(x=>({n:x.instrument_name,tk:x.symbol,pl:x.exchange,mic:x.mic_code,c:x.currency,isin:null,sec:'',p:'France'}));
  }
  const seenTk=new Set(local.map(x=>x.tk));
  live=live.filter(x=>!seenTk.has(x.tk));
  const merged=[...local,...live].slice(0,15);
  merged.forEach(cacheItem);
  BQres=merged; BQloading=false; render();
}
let TITRE_DATA={};
async function loadTitre(key){
  const x=findTitle(key); if(!x) return;
  TITRE_DATA[key]={loading:true}; render();
  const [q,st]=await Promise.all([tdQuote(x.tk,x.mic),tdStatistics(x.tk,x.mic)]);
  TITRE_DATA[key]={loading:false,quote:q,stats:st}; render();
}
function bourseRow(x,isResult){
  const k=titleKey(x), inWl=S.watchlist.some(w=>titleKey(w)===k);
  return `<div class="row" data-act="openTitre" data-k="${esc(k)}">
    <span class="l"><strong>${esc(x.n)}</strong><span class="small muted">${esc(x.tk)} · ${esc(x.pl||'')}</span></span>
    <span class="r"><button class="chip ${inWl?'on':'warm'}" data-act="${inWl?'wlDel':'wlAdd'}" data-k="${esc(k)}">${inWl?'Suivi ✓':'Suivre'}</button></span></div>`;
}

const LABELS={query:'Recherche',pick:'Titre',confirm:'Titre',qty:'Quantité',price:'Prix unitaire',date:'Date d\u2019achat',fees:'Frais',env:'Enveloppe',
 name:'Nom',type:'Type',value:'Valeur estimée',valueDate:'Date d\u2019estimation',buyPrice:'Prix d\u2019achat',works:'Travaux',loan:'Capital restant dû',
 rate:'Taux',years:'Durée restante',insurance:'Assurance',monthly:'Mensualité',balance:'Solde',balanceDate:'Date du solde',kind:'Enveloppe',cash:'Liquidités'};

function startWizard(cls,resumeDraft){
  const d=resumeDraft&&S.drafts[cls]?S.drafts[cls]:{data:{},step:0};
  W={cls,step:d.step||0,data:Object.assign({},d.data),err:''};
  if(!W.data.date&&cls==='bourse') W.data.date=todayISO();
  if(!W.data.valueDate&&cls==='immobilier') W.data.valueDate=todayISO();
  if(!W.data.balanceDate&&cls==='liquidites') W.data.balanceDate=todayISO();
  $('#tabbar').classList.add('hide');
  drawWizard();
}
function steps(){ let f=FLOWS[W.cls]; if(W.cls==='bourse'&&W.data.manual) f=f.filter(x=>x.k!=='pick'); return f; }
function cur(){ return steps()[W.step]; }

function drawWizard(){
  const el=$('#wiz'); el.classList.add('on');
  const st=cur(), n=steps().length;
  el.innerHTML=`<div class="wiz-top">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="lbl">${CLASSES[W.cls].name} · étape ${W.step+1} sur ${n}</div>
        <button class="lbl" data-act="wizClose" style="font-weight:700;color:var(--ink-soft)">Fermer</button>
      </div>
      <div class="prog"><i style="width:${(W.step+1)/n*100}%"></i></div>
    </div>
    <div class="wiz-body">
      <div class="wiz-q">${st.q}</div>
      ${bodyFor(st)}
      ${st.help?`<div class="helper">${st.help}</div>`:''}
      <div class="err">${esc(W.err)}</div>
    </div>
    <div class="wiz-foot"><div class="btnrow">
      ${W.step>0?'<button class="btn ghost" data-act="wizBack">Retour</button>':''}
      ${['results','list','env'].includes(st.t)?'':`<button class="btn" data-act="wizNext">${st.t==='recap'?'Enregistrer':'Continuer'}</button>`}
    </div></div>`;
  const i=el.querySelector('.field'); if(i&&['text','num','date'].includes(st.t)) setTimeout(()=>i.focus({preventScroll:true}),60);
}

function bodyFor(st){
  const d=W.data, v=d[st.k];
  if(st.t==='text') return `<input class="field" id="wf" value="${esc(v||'')}" placeholder="${esc(st.ph||'')}" autocomplete="off" enterkeyhint="next">`;
  if(st.t==='num') return `<div style="display:flex;align-items:baseline;gap:8px"><input class="field" id="wf" inputmode="decimal" value="${v!=null?String(v).replace('.',','):''}" placeholder="${esc(st.ph||'')}" enterkeyhint="next"><span style="font-size:var(--t5);font-weight:700;color:var(--ink-soft)">${st.suffix||CCY[S.user.base].s}</span></div>`;
  if(st.t==='date') return `<input class="field" id="wf" type="date" value="${v||todayISO()}" max="${todayISO()}">`;
  if(st.t==='list') return st.opts.map(o=>`<button class="opt ${v===o?'on':''}" data-act="wizPick" data-v="${esc(o)}"><strong>${esc(st.labels?st.labels[o]:o)}</strong></button>`).join('');
  if(st.t==='results'){
    const r=searchCatalog(d.query||'');
    return (r.length?r.map(c=>`<button class="opt" data-act="wizHit" data-isin="${c.isin}"><strong>${esc(c.n)}</strong><span>${c.tk} · ${c.isin} · ${c.pl} · ${c.c}</span></button>`).join('')
      :`<p class="muted">Aucun titre ne correspond à « ${esc(d.query)} ».</p>`)
      +`<button class="opt" data-act="wizManual"><strong>Aucun de ces titres</strong><span>Créer un actif non coté, saisi entièrement à la main</span></button>`;
  }
  if(st.t==='confirm'){
    if(d.manual) return `<input class="field" id="wf" value="${esc(d.name||d.query||'')}" placeholder="Nom de l'actif">
      <div class="helper">Actif non coté : aucun cours automatique, aucune actualité rattachée.</div>
      <div style="margin-top:var(--s4)"><div class="lbl" style="margin-bottom:var(--s2)">Devise de la ligne</div>
      ${Object.keys(CCY).map(c=>`<button class="chip ${(d.ccy||'EUR')===c?'on':''}" data-act="wizCcy" data-c="${c}" style="margin-right:6px">${c}</button>`).join('')}</div>`;
    const c=CATALOG.find(x=>x.isin===d.isin)||{};
    return `<div style="background:var(--surface);padding:var(--s4);border-radius:var(--r)">
      <div class="kv"><span>Nom officiel</span><span>${esc(c.n)}</span></div>
      <div class="kv"><span>ISIN</span><span class="num">${esc(c.isin)}</span></div>
      <div class="kv"><span>Ticker</span><span class="num">${esc(c.tk)}</span></div>
      <div class="kv"><span>Place</span><span>${esc(c.pl)}</span></div>
      <div class="kv"><span>Devise</span><span>${esc(c.c)}</span></div>
      <div class="kv"><span>Secteur</span><span>${esc(c.sec)}</span></div>
      <div class="kv"><span>Pays</span><span>${esc(c.p)}</span></div>
    </div>
    <div class="helper">Sans cette confirmation, aucune actualité n'est rattachée à la ligne.</div>
    <div style="margin-top:var(--s4)"><button class="btn quiet" data-act="wizBack">Ce n'est pas ce titre</button></div>`;
  }
  if(st.t==='env'){
    const exist=S.assets.filter(a=>a.cls==='enveloppes');
    return ['PEA','CTO','AV'].map(k=>{
      const e=exist.find(x=>x.kind===k);
      return `<button class="opt ${d.env===k?'on':''}" data-act="wizPickEnv" data-v="${k}"><strong>${ENV_NAME[k]} — ${pct(ENV_TAX[k],1)}</strong><span>${e?'Enveloppe existante : '+esc(e.name):'Sera créée automatiquement'}</span></button>`;
    }).join('')+`<button class="opt ${d.env==='NONE'?'on':''}" data-act="wizPickEnv" data-v="NONE"><strong>Aucune enveloppe</strong><span>Détention en direct</span></button>`;
  }
  if(st.t==='recap'){
    const rows=steps().filter(x=>!['recap','pick','query'].includes(x.k)).map(x=>{
      let val=d[x.k];
      if(x.k==='confirm'){ const c=CATALOG.find(y=>y.isin===d.isin); val=d.manual?(d.name||'—')+' (non coté)':(c?c.n:'—'); }
      else if(x.k==='env') val=d.env==='NONE'?'Aucune':ENV_NAME[d.env];
      else if(x.k==='kind') val=ENV_NAME[d.kind];
      else if(['date','valueDate','balanceDate'].includes(x.k)) val=fmtDate(val);
      else if(x.t==='num') val=(Number(val)||0).toLocaleString('fr-FR')+' '+(x.suffix||CCY[S.user.base].s);
      const i=steps().findIndex(y=>y.k===x.k);
      return `<button class="kv" style="width:100%;text-align:left" data-act="wizJump" data-i="${i}"><span>${LABELS[x.k]||x.k}</span><span>${esc(val==null?'—':val)} ✎</span></button>`;
    }).join('');
    return `<div>${rows}</div><div class="helper">Touchez une ligne pour la corriger.</div>`;
  }
  return '';
}

function readField(){
  const st=cur(), el=$('#wf'); if(!el) return true;
  if(st.t==='text'||(st.t==='confirm'&&W.data.manual)){
    const v=el.value.trim();
    if(!v){ W.err='Ce champ est obligatoire.'; return false; }
    W.data[st.t==='confirm'?'name':st.k]=v; return true;
  }
  if(st.t==='num'){
    const n=num(el.value);
    if(n==null){ W.err='Saisissez un nombre. Mettez 0 si la valeur est nulle.'; return false; }
    if(st.min!=null&&n<st.min){ W.err=st.min>0?'Cette valeur doit être supérieure à zéro.':'Valeur négative impossible.'; return false; }
    W.data[st.k]=n; return true;
  }
  if(st.t==='date'){
    if(!el.value){ W.err='Choisissez une date.'; return false; }
    W.data[st.k]=el.value; return true;
  }
  return true;
}
function wizNext(){
  W.err='';
  const st=cur();
  if(st.t==='list'&&!W.data[st.k]){ W.err='Choisissez une option.'; drawWizard(); return; }
  if(st.t==='env'&&!W.data.env){ W.err='Choisissez une enveloppe, ou « Aucune ».'; drawWizard(); return; }
  if(st.t==='results'){ W.err='Choisissez un titre dans la liste.'; drawWizard(); return; }
  if(!readField()){ drawWizard(); return; }
  if(st.t==='recap'){ commit(); return; }
  if(st.k==='query'){ W.data.manual=false; W.data.isin=null; }
  W.step++; saveDraft(); drawWizard();
}
function saveDraft(){ S.drafts[W.cls]={data:W.data,step:W.step}; persist(); }
function closeWizard(keep){
  if(keep&&W&&W.step>0){ saveDraft(); toast('Brouillon conservé, reprise possible depuis Alertes.'); }
  W=null; $('#wiz').classList.remove('on'); $('#tabbar').classList.remove('hide'); render();
}

/* ---------- enregistrement ---------- */
function ensureEnv(kind){
  let e=S.assets.find(a=>a.cls==='enveloppes'&&a.kind===kind);
  if(!e){ e={id:uid(),cls:'enveloppes',kind,name:ENV_NAME[kind],ccy:S.user.base,cash:0,fx:fxNow(S.user.base)}; S.assets.push(e); touch(e); }
  return e;
}
function commit(){
  const d=W.data, cls=W.cls;
  if(cls==='bourse'){
    const c=CATALOG.find(x=>x.isin===d.isin);
    const ccy=d.manual?(d.ccy||'EUR'):c.c;
    let a=!d.manual&&S.assets.find(x=>x.isin===d.isin&&x.cls==='bourse');
    if(!a){
      a={id:uid(),cls:'bourse',listed:!d.manual,name:d.manual?d.name:c.n,isin:d.manual?null:c.isin,tk:d.manual?null:c.tk,
         place:d.manual?null:c.pl,sec:d.manual?null:c.sec,country:d.manual?null:c.p,ccy,envId:null,
         px:{value:d.manual?d.price:c.px,date:todayISO(),src:d.manual?'Saisi manuellement':'Catalogue local',fx:fxNow(ccy)}};
      S.assets.push(a);
    }
    if(d.env&&d.env!=='NONE') a.envId=ensureEnv(d.env).id; else a.envId=null;
    S.lots.push({id:uid(),assetId:a.id,qty:d.qty,price:d.price,date:d.date,fees:d.fees||0,ccy,fx:fxNow(ccy)});
    touch(a);
    if(a.envId) touch(assetById(a.envId));
  }
  if(cls==='immobilier'){
    const ccy=S.user.base;
    const a={id:uid(),cls:'immobilier',name:d.name,type:d.type,value:d.value,valueDate:d.valueDate,buyPrice:d.buyPrice,fees:d.fees,works:d.works,ccy,fx:fxNow(ccy)};
    S.assets.push(a); touch(a);
    if(d.loan>0){ S.liabilities.push({id:uid(),assetId:a.id,amount:d.loan,rate:d.rate,years:d.years,insurance:d.insurance,monthly:d.monthly}); touchDebt(); }
  }
  if(cls==='liquidites'){
    const ccy=S.user.base;
    const a={id:uid(),cls:'liquidites',name:d.type,type:d.type,balance:d.balance,balanceDate:d.balanceDate,bank:'',rate:null,ccy,fx:fxNow(ccy)};
    S.assets.push(a); touch(a);
  }
  if(cls==='enveloppes'){
    const ccy=S.user.base;
    let a=S.assets.find(x=>x.cls==='enveloppes'&&x.kind===d.kind);
    if(a){ a.name=d.name; a.cash=d.cash; touch(a); }
    else { a={id:uid(),cls:'enveloppes',kind:d.kind,name:d.name,cash:d.cash,ccy,fx:fxNow(ccy)}; S.assets.push(a); touch(a); }
  }
  delete S.drafts[cls];
  snapshotToday(); persist();
  W=null; $('#wiz').classList.remove('on'); $('#tabbar').classList.remove('hide');
  TAB='patrimoine'; stack=[]; render();
  toast('Ligne enregistrée.');
}


/* ============================================================
   12. ACTIONS
   ============================================================ */
const ACT={
  /* navigation */
  startClass:d=>{ if(S.drafts[d.cls]) askResume(d.cls); else startWizard(d.cls,false); },
  resume:d=>startWizard(d.cls,true),
  openClass:d=>{ pageN=30; push('classe',d.cls); },
  openAsset:d=>push('actif',d.id),
  openProj:d=>push('projet',d.id),
  goto:d=>push(d.t,d.id),
  more:()=>{ pageN+=30; render(); },
  range:d=>{ RANGE=+d.d; render(); },
  dismiss:d=>{ S.dismissed.push(d.id); persist(); render(); },
  dropDraft:d=>{ delete S.drafts[d.cls]; persist(); render(); },

  /* bourse */
  openTitre:d=>push('titre',d.k),
  wlAdd:d=>{ const x=findTitle(d.k); if(!x) return;
    if(!S.watchlist.some(w=>titleKey(w)===d.k)){ S.watchlist.push(Object.assign({},x,{addedDate:todayISO()})); persist(); }
    render(); toast('Ajouté à la watchlist.'); },
  wlDel:d=>{ S.watchlist=S.watchlist.filter(w=>titleKey(w)!==d.k); persist(); render(); toast('Retiré de la watchlist.'); },
  refreshTitre:d=>loadTitre(d.k),

  /* onboarding */
  obCcy:d=>{ ob.base=d.c; renderOnboarding(); },
  obBack:()=>{ const i=$('#obName'); if(i) ob.name=i.value; ob.step--; renderOnboarding(); },
  obNext:()=>{
    if(ob.step===0){ const i=$('#obName'), v=i.value.trim();
      if(!v){ $('#obErr').textContent='Un prénom est nécessaire pour continuer.'; return; }
      ob.name=v; ob.step=1; renderOnboarding(); return; }
    finishOnboarding();
  },

  /* assistant */
  wizNext, wizBack:()=>{ W.err=''; if(W.step>0){ W.step--; drawWizard(); } },
  wizClose:()=>closeWizard(true),
  wizPick:d=>{ W.data[cur().k]=d.v; W.err=''; W.step++; saveDraft(); drawWizard(); },
  wizPickEnv:d=>{ W.data.env=d.v; W.err=''; W.step++; saveDraft(); drawWizard(); },
  wizHit:d=>{ W.data.isin=d.isin; W.data.manual=false; W.err=''; W.step++; saveDraft(); drawWizard(); },
  wizManual:()=>{ W.data.manual=true; W.data.isin=null; W.data.ccy='EUR'; W.err=''; W.step=steps().findIndex(x=>x.k==='confirm'); saveDraft(); drawWizard(); },
  wizCcy:d=>{ W.data.ccy=d.c; drawWizard(); },
  wizJump:d=>{ W.step=+d.i; W.err=''; drawWizard(); },

  /* fiches actif */
  editPx:d=>{ const a=assetById(d.id);
    openSheet(`<h3>Mettre à jour le cours</h3>
      <p class="small muted">Dernier cours connu : ${(a.px.value).toLocaleString('fr-FR')} ${CCY[a.ccy].s} au ${fmtDate(a.px.date)}.</p>
      <div class="lbl" style="margin-top:var(--s4)">Nouveau cours en ${a.ccy}</div>
      <input class="field sm" id="f1" inputmode="decimal" value="${a.px.value}">
      <div class="lbl" style="margin-top:var(--s4)">Date du cours</div>
      <input class="field sm" id="f2" type="date" value="${todayISO()}" max="${todayISO()}">
      <div class="lbl" style="margin-top:var(--s4)">Source</div>
      <input class="field sm" id="f3" value="${esc(a.px.src||'Saisi manuellement')}">
      <div style="margin-top:var(--s5)"><button class="btn" data-act="savePx" data-id="${a.id}">Enregistrer</button>
      <button class="btn ghost" data-close="1">Annuler</button></div>`); },
  savePx:d=>{ const a=assetById(d.id), v=num($('#f1').value);
    if(v==null||v<0){ toast('Cours invalide.'); return; }
    a.px={value:v,date:$('#f2').value||todayISO(),src:$('#f3').value.trim()||'Saisi manuellement',fx:fxNow(a.ccy)};
    touch(a); if(a.envId) touch(assetById(a.envId)); snapshotToday(); closeSheet(); render(); toast('Cours mis à jour.'); },

  addLot:d=>{ const a=assetById(d.id);
    openSheet(`<h3>Ajouter un lot</h3>
      <div class="lbl" style="margin-top:var(--s4)">Quantité</div><input class="field sm" id="f1" inputmode="decimal">
      <div class="lbl" style="margin-top:var(--s4)">Prix unitaire en ${a.ccy}</div><input class="field sm" id="f2" inputmode="decimal">
      <div class="lbl" style="margin-top:var(--s4)">Date d'achat</div><input class="field sm" id="f3" type="date" value="${todayISO()}" max="${todayISO()}">
      <div class="lbl" style="margin-top:var(--s4)">Frais</div><input class="field sm" id="f4" inputmode="decimal" value="0">
      <div style="margin-top:var(--s5)"><button class="btn" data-act="saveLot" data-id="${a.id}">Enregistrer</button>
      <button class="btn ghost" data-close="1">Annuler</button></div>`); },
  saveLot:d=>{ const a=assetById(d.id), q=num($('#f1').value), p=num($('#f2').value), f=num($('#f4').value);
    if(!q||q<=0||p==null||p<0||f==null||f<0){ toast('Tous les champs sont obligatoires.'); return; }
    S.lots.push({id:uid(),assetId:a.id,qty:q,price:p,date:$('#f3').value||todayISO(),fees:f,ccy:a.ccy,fx:fxNow(a.ccy)});
    touch(a); if(a.envId) touch(assetById(a.envId)); snapshotToday(); closeSheet(); render(); toast('Lot ajouté.'); },
  delLot:d=>{ const l=S.lots.find(x=>x.id===d.id); if(!l) return;
    S.lots=S.lots.filter(x=>x.id!==d.id); const a=assetById(l.assetId); touch(a); snapshotToday(); render(); toast('Lot supprimé.'); },

  setEnv:d=>{ const a=assetById(d.id);
    openSheet(`<h3>Enveloppe</h3>${['PEA','CTO','AV'].map(k=>`<button class="opt" data-act="doSetEnv" data-id="${a.id}" data-k="${k}"><strong>${ENV_NAME[k]} — ${pct(ENV_TAX[k],1)}</strong></button>`).join('')}
      <button class="opt" data-act="doSetEnv" data-id="${a.id}" data-k="NONE"><strong>Aucune enveloppe</strong></button>`); },
  doSetEnv:d=>{ const a=assetById(d.id), old=a.envId;
    a.envId = d.k==='NONE'?null:ensureEnv(d.k).id;
    touch(a); if(old) touch(assetById(old)); if(a.envId) touch(assetById(a.envId));
    snapshotToday(); closeSheet(); render(); toast('Enveloppe mise à jour.'); },

  editValue:d=>{ const a=assetById(d.id), isImmo=a.cls==='immobilier';
    openSheet(`<h3>${isImmo?'Actualiser l\'estimation':'Mettre à jour le solde'}</h3>
      <div class="lbl" style="margin-top:var(--s4)">Montant en ${a.ccy}</div>
      <input class="field sm" id="f1" inputmode="decimal" value="${isImmo?a.value:a.balance}">
      <div class="lbl" style="margin-top:var(--s4)">Date</div>
      <input class="field sm" id="f2" type="date" value="${todayISO()}" max="${todayISO()}">
      <div style="margin-top:var(--s5)"><button class="btn" data-act="saveValue" data-id="${a.id}">Enregistrer</button>
      <button class="btn ghost" data-close="1">Annuler</button></div>`); },
  saveValue:d=>{ const a=assetById(d.id), v=num($('#f1').value);
    if(v==null||v<0){ toast('Montant invalide.'); return; }
    if(a.cls==='immobilier'){ a.value=v; a.valueDate=$('#f2').value; } else { a.balance=v; a.balanceDate=$('#f2').value; }
    a.fx=fxNow(a.ccy); touch(a); snapshotToday(); closeSheet(); render(); toast('Mis à jour.'); },

  editBank:d=>{ const a=assetById(d.id);
    openSheet(`<h3>Établissement et taux</h3>
      <div class="lbl" style="margin-top:var(--s4)">Établissement</div><input class="field sm" id="f1" value="${esc(a.bank||'')}">
      <div class="lbl" style="margin-top:var(--s4)">Taux annuel en %</div><input class="field sm" id="f2" inputmode="decimal" value="${a.rate!=null?a.rate:''}">
      <div style="margin-top:var(--s5)"><button class="btn" data-act="saveBank" data-id="${a.id}">Enregistrer</button>
      <button class="btn ghost" data-close="1">Annuler</button></div>`); },
  saveBank:d=>{ const a=assetById(d.id); a.bank=$('#f1').value.trim(); const r=num($('#f2').value); a.rate=r==null?null:r;
    persist(); closeSheet(); render(); toast('Enregistré.'); },

  editCash:d=>{ const a=assetById(d.id);
    openSheet(`<h3>Liquidités de l'enveloppe</h3>
      <div class="lbl" style="margin-top:var(--s4)">Montant en ${a.ccy}</div><input class="field sm" id="f1" inputmode="decimal" value="${a.cash||0}">
      <div style="margin-top:var(--s5)"><button class="btn" data-act="saveCash" data-id="${a.id}">Enregistrer</button>
      <button class="btn ghost" data-close="1">Annuler</button></div>`); },
  saveCash:d=>{ const a=assetById(d.id), v=num($('#f1').value); if(v==null||v<0){toast('Montant invalide.');return;}
    a.cash=v; a.fx=fxNow(a.ccy); touch(a); snapshotToday(); closeSheet(); render(); toast('Enregistré.'); },

  delAsset:d=>{ const a=assetById(d.id);
    openSheet(`<h3>Supprimer ${esc(a.name)} ?</h3><p class="small muted">Les lots, le crédit adossé et l'historique de cette ligne seront perdus. L'action est définitive.</p>
      <div style="margin-top:var(--s5)"><button class="btn danger" data-act="doDelAsset" data-id="${a.id}">Supprimer définitivement</button>
      <button class="btn ghost" data-close="1">Annuler</button></div>`); },
  doDelAsset:d=>{ const a=assetById(d.id);
    S.assets.filter(x=>x.envId===d.id).forEach(x=>{x.envId=null;touch(x);});
    S.lots=S.lots.filter(l=>l.assetId!==d.id);
    S.liabilities=S.liabilities.filter(l=>l.assetId!==d.id);
    S.assets=S.assets.filter(x=>x.id!==d.id);
    rebuildTotals(); snapshotToday(); closeSheet(); stack=[]; render(); toast('Ligne supprimée.'); },

  /* projets */
  startProj:()=>{
    openSheet(`<h3>Nouveau projet</h3>
      <div class="lbl" style="margin-top:var(--s4)">Intitulé</div><input class="field sm" id="p1" placeholder="Achat appartement Lyon 3e">
      <div class="lbl" style="margin-top:var(--s4)">Montant visé</div><input class="field sm" id="p2" inputmode="decimal" placeholder="0">
      <div class="lbl" style="margin-top:var(--s4)">Apport</div><input class="field sm" id="p3" inputmode="decimal" value="0">
      <div class="lbl" style="margin-top:var(--s4)">Frais</div><input class="field sm" id="p4" inputmode="decimal" value="0">
      <div class="lbl" style="margin-top:var(--s4)">Taux du crédit en %</div><input class="field sm" id="p5" inputmode="decimal" value="3,5">
      <div class="lbl" style="margin-top:var(--s4)">Durée en années</div><input class="field sm" id="p6" inputmode="decimal" value="20">
      <div class="lbl" style="margin-top:var(--s4)">Assurance en %</div><input class="field sm" id="p7" inputmode="decimal" value="0,34">
      <div class="lbl" style="margin-top:var(--s4)">Échéance visée</div><input class="field sm" id="p8" type="date" value="${todayISO()}">
      <div style="margin-top:var(--s5)"><button class="btn" data-act="saveProj">Créer le projet</button>
      <button class="btn ghost" data-close="1">Annuler</button></div>`); },
  saveProj:()=>{
    const g=i=>num($('#p'+i).value), n=$('#p1').value.trim();
    if(!n||g(2)==null||g(3)==null||g(4)==null||g(5)==null||g(6)==null||g(7)==null){ toast('Tous les champs sont obligatoires.'); return; }
    S.projects.push({id:uid(),name:n,target:g(2),down:g(3),fees:g(4),rate:g(5),years:g(6),insurance:g(7),date:$('#p8').value,done:false});
    persist(); closeSheet(); TAB='projets'; stack=[]; render(); toast('Projet créé, hors patrimoine.'); },
  actProj:d=>{ const p=S.projects.find(x=>x.id===d.id);
    openSheet(`<h3>Acter « ${esc(p.name)} » ?</h3><p class="small muted">Le bien entre dans Patrimoine pour ${money(p.target)} et le crédit de ${money(finance(p).borrowed)} vient en déduction du net.</p>
      <div style="margin-top:var(--s5)"><button class="btn ember" data-act="doActProj" data-id="${p.id}">Acter et basculer</button>
      <button class="btn ghost" data-close="1">Annuler</button></div>`); },
  doActProj:d=>{ const p=S.projects.find(x=>x.id===d.id), f=finance(p), ccy=S.user.base;
    const a={id:uid(),cls:'immobilier',name:p.name,type:'Investissement locatif',value:p.target,valueDate:todayISO(),
             buyPrice:p.target,fees:p.fees,works:0,ccy,fx:fxNow(ccy)};
    S.assets.push(a); touch(a);
    if(f.borrowed>0){ S.liabilities.push({id:uid(),assetId:a.id,amount:f.borrowed,rate:p.rate,years:p.years,insurance:p.insurance,monthly:f.monthly}); touchDebt(); }
    p.done=true; snapshotToday(); persist(); closeSheet(); stack=[]; TAB='patrimoine'; render(); toast('Projet acté et intégré au patrimoine.'); },
  delProj:d=>{ S.projects=S.projects.filter(x=>x.id!==d.id); persist(); stack=[]; render(); toast('Projet supprimé.'); },

  /* recherche */
  quickAdd:d=>{ startWizard('bourse',false); W.data.query=CATALOG.find(c=>c.isin===d.isin).n; W.data.isin=d.isin; W.data.manual=false; W.step=2; drawWizard(); },

  /* réglages */
  setName:(_,el)=>{ S.user.name=el.value.trim(); persist(); toast('Prénom enregistré.'); },
  setBase:(_,el)=>{ S.user.base=el.value; persist(); render(); toast('Affichage en '+el.value+'.'); },
  setTheme:d=>{ S.theme=d.t; applyTheme(); persist(); render(); },
  setTdKey:(_,el)=>{ S.tdKey=el.value.trim(); persist(); toast('Clé Twelve Data enregistrée.'); },
  setRate:(d,el)=>{ const v=num(el.value); if(!v||v<=0){ toast('Taux invalide.'); render(); return; }
    S.rates[d.rate]=v; rebuildTotals(); persist(); render(); toast('Taux mis à jour.'); },
  export:()=>{
    const json=JSON.stringify(S,(k,v)=>k==='_c'?undefined:v,2);
    let ok=false;
    try{ const b=new Blob([json],{type:'application/json'}), u=URL.createObjectURL(b), a=document.createElement('a');
      a.href=u; a.download='amalthee-'+todayISO()+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(u),4000); ok=true; }catch(e){}
    openSheet(`<h3>Export</h3><p class="small muted">${ok?'Le fichier a été proposé au téléchargement. ':''}Vous pouvez aussi copier le contenu ci-dessous.</p>
      <textarea class="field sm" style="height:220px;border:1px solid var(--rule);border-radius:var(--r);padding:var(--s3);font-size:12px" readonly>${esc(json)}</textarea>
      <div style="margin-top:var(--s4)"><button class="btn ghost" data-close="1">Fermer</button></div>`); },
  import:()=>{ openSheet(`<h3>Importer un JSON</h3>
      <p class="small muted">L'import remplace la totalité de vos données. Il n'y a pas de fusion.</p>
      <textarea class="field sm" id="imp" style="height:200px;border:1px solid var(--rule);border-radius:var(--r);padding:var(--s3);font-size:12px" placeholder="Collez ici le contenu du fichier"></textarea>
      <div style="margin-top:var(--s4)"><button class="btn danger" data-act="doImport">Remplacer toutes mes données</button>
      <button class="btn ghost" data-close="1">Annuler</button></div>`); },
  doImport:()=>{ try{ const o=JSON.parse($('#imp').value);
      if(!o||!o.assets){ toast('Fichier non reconnu.'); return; }
      S=Object.assign(blank(),o); rebuildTotals(); persist(); Store.save(S);
      closeSheet(); applyTheme(); stack=[]; TAB='patrimoine'; render(); toast('Données remplacées.');
    }catch(e){ toast('JSON invalide.'); } },
  demo:()=>{ makeDemoHistory(); render(); toast('Historique de démonstration généré.'); },
  clearSnaps:()=>{ S.snapshots=[]; snapshotToday(); render(); toast('Historique effacé.'); },
  reset:()=>{ openSheet(`<h3>Tout réinitialiser ?</h3><p class="small muted">Lignes, projets, historique et réglages seront effacés. L'action est définitive.</p>
      <div style="margin-top:var(--s5)"><button class="btn danger" data-act="doReset">Effacer définitivement</button>
      <button class="btn ghost" data-close="1">Annuler</button></div>`); },
  doReset:async()=>{ await Store.wipe(); S=blank(); closeSheet(); location.reload(); }
};
function askResume(cls){
  const d=S.drafts[cls];
  openSheet(`<h3>Reprendre votre saisie ?</h3>
    <p class="small muted">Une saisie ${CLASSES[cls].name} a été interrompue à l'étape ${(d.step||0)+1}. Votre brouillon a été conservé.</p>
    <div style="margin-top:var(--s5)"><button class="btn" data-act="doResume" data-cls="${cls}">Reprendre</button>
    <button class="btn ghost" data-act="doFresh" data-cls="${cls}">Recommencer</button></div>`);
}
ACT.doResume=d=>{ closeSheet(); startWizard(d.cls,true); };
ACT.doFresh=d=>{ delete S.drafts[d.cls]; persist(); closeSheet(); startWizard(d.cls,false); };

/* service worker : fonctionnement hors ligne une fois installé */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* ============================================================
   13. DÉMARRAGE
   ============================================================ */
(async function init(){
  const saved=await Store.load();
  if(saved) S=Object.assign(blank(),saved);
  applyTheme();
  rebuildTotals();
  if(!S.onboarded){
    playIntro(()=>{ ob={step:0,name:S.user.name||'',base:S.user.base||'EUR'}; renderOnboarding(); });
    return;
  }
  /* instantané quotidien à la première ouverture du jour */
  const t=todayISO();
  if(S.lastOpen!==t){ S.lastOpen=t; snapshotToday(); }
  playIntro(()=>greet(()=>{
    $('#app').style.display='flex'; $('#tabbar').classList.remove('hide'); go('patrimoine');
  }));
})();

</script>
</body>
</html>
